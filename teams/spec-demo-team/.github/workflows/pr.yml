# PR：驗證通過 → 部署預覽環境 → E2E 驗收測試 → 在 PR 留言預覽網址
name: pr

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy-preview:
    needs: verify
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    outputs:
      site_url: ${{ steps.out.outputs.site_url }}
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-east-2' }}
      - run: npm ci
      - run: npm run build
      - name: Basic Auth 設定
        env:
          USER: ${{ secrets.BASIC_AUTH_USER }}
          PASS: ${{ secrets.BASIC_AUTH_PASSWORD }}
        run: |
          B64=$(printf '%s:%s' "$USER" "$PASS" | base64 -w0)
          echo "::add-mask::$B64"
          echo "BASIC_AUTH_B64=$B64" >> "$GITHUB_ENV"
      - name: cdk deploy
        run: >
          npx -w infra cdk deploy "SpecDemo-$STAGE" --require-approval never --outputs-file cdk-outputs.json
          -c stage="$STAGE"
          -c appRegion="${{ vars.AWS_REGION || 'ap-east-2' }}"
          -c bedrockRegion="${{ vars.BEDROCK_REGION }}"
          -c bedrockModelId="${{ vars.BEDROCK_MODEL_ID }}"
          -c basicAuth="$BASIC_AUTH_B64"
      - id: out
        run: echo "site_url=$(node -p "require('./infra/cdk-outputs.json')['SpecDemo-$STAGE'].SiteUrl")" >> "$GITHUB_OUTPUT"
      - name: 在 PR 留言預覽網址
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body \
            "🚀 預覽環境已更新：${{ steps.out.outputs.site_url }}（帳密請向 PM 取得）｜commit ${{ github.event.pull_request.head.sha }}"

  e2e:
    needs: deploy-preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E 驗收測試
        env:
          E2E_BASE_URL: ${{ needs.deploy-preview.outputs.site_url }}
          E2E_BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
          E2E_BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
        run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            tests/e2e/screenshots/
